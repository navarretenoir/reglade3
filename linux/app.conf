# Regla de 3 — configuración de empaquetado Linux (la usa herramientas/linux-pkg/empaquetar.sh)
APP_ID=io.github.navarretenoir.ReglaDe3
PAQUETE=regla-de-3
NOMBRE="Regla de 3"
NOMBRE_ARCHIVO=ReglaDe3
VERSION=$(cat "$APP/VERSION")
BIN_GUI=regla-de-3
RESUMEN="Regla de tres fácil, con el paso a paso: directa, inversa, compuesta y porcentajes"
DESCRIPCION="Calcula lo que no sabes a partir de lo que sí sabes: regla de tres directa, inversa y compuesta, porcentajes, descuentos e IVA, explicado paso a paso en palabras simples. Sin internet y sin cuentas."
DEPS_RPM="gtk4, webkitgtk6.0"
DEPS_DEB="libgtk-4-1, libwebkitgtk-6.0-4"
FLATPAK_EXTRA=""
SNAP_EXTRA=""
compilar() {
  local pre=$1 out=$2 w; w=$(mktemp -d)
  cp -a "$APP/desktop/." "$w/"; rm -f "$w/regla-de-3"
  make -s -C "$w" UI_DIR="$pre/share/regla-de-3/ui" >/dev/null; strip "$w/regla-de-3"; cp "$w/regla-de-3" "$out/"
  rm -rf "$w"
}
instalar() {
  install -Dm755 "$3/regla-de-3" "$1$2/bin/regla-de-3"
  mkdir -p "$1$2/share/regla-de-3"; cp -r "$APP/ui" "$1$2/share/regla-de-3/"; rm -f "$1$2/share/regla-de-3/ui/"*.bak*
}
appimage_entorno() { echo 'export REGLA_UI="$HERE/usr/share/regla-de-3/ui"'; }
