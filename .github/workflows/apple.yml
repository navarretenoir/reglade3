# Compila EscalaNotas para macOS (universal) e iOS en un Mac de GitHub (sin firma: para probar; firmar requiere cuenta de Apple).
name: EscalaNotas Apple
on: [workflow_dispatch, push]
jobs:
  compilar:
    runs-on: macos-15
    defaults: { run: { working-directory: apple } }
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: brew install xcodegen
      - run: ./preparar-web.sh && xcodegen generate
      - run: xcodebuild -project EscalaNotas.xcodeproj -scheme EscalaNotas-macOS -configuration Release -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build SYMROOT=$PWD/build
      - run: xcodebuild -project EscalaNotas.xcodeproj -scheme EscalaNotas-iOS -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build SYMROOT=$PWD/build
      - run: lipo -info "build/Release/EscalaNotas.app/Contents/MacOS/EscalaNotas"
      - uses: actions/upload-artifact@v4
        with: { name: EscalaNotas-apple, path: "apple/build/Release*/*.app" }
